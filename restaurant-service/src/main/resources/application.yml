server:
  port: 8082

spring:
  application:
    name: restaurant-service

  # Postgres proprio do servico (database-per-service).
  # Os valores vem de variaveis de ambiente no docker-compose; o default roda local.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurants}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Cache Redis
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Servidor MCP: a IA descobre e chama as ferramentas em http://localhost:8082/mcp
  ai:
    mcp:
      server:
        protocol: STREAMABLE

# Expoe o health para o dashboard de visualizacao dos componentes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      cors:
        allowed-origins: "*"
        allowed-methods: GET
  endpoint:
    health:
      show-details: always
