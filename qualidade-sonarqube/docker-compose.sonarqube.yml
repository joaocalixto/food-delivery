name: food-delivery-sonar

services:
  sonarqube-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sonar-net]

  sonarqube:
    build: .
    image: food-delivery/sonarqube:26.10-community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Só para ambiente local: evita o erro de vm.max_map_count do Elasticsearch
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports: ["9100:9000"]
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks: [sonar-net]

volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:

networks:
  sonar-net:
    name: sonar-net   # nome fixo: o analisar.sh pluga o container do Maven nela