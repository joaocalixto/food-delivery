server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /lab/orders {
        proxy_pass http://order-service:8081/orders;
        proxy_set_header Host $host;
    }

    location /lab/payments {
        proxy_pass http://payment-service:8085/payments;
        proxy_set_header Host $host;
    }
}
